{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuminaRecs — Password Reset Complete</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}" />

    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --cinema-black: #020307;
        --prestige-gold: #c39b34;
        --prestige-light: #e6c15c;
        --text: #d1d5db;
        --muted: #8d95a3;
        --glass: rgba(6, 9, 20, 0.82);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--cinema-black);
        color: var(--text);
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
        min-height: 100svh;
      }

      .film-grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      }

      .matte-top,
      .matte-bottom {
        position: fixed;
        left: 0;
        width: 100%;
        height: 8vh;
        background: #000;
        z-index: 950;
      }

      .matte-top { top: 0; }
      .matte-bottom { bottom: 0; }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 1;
        overflow: hidden;
      }

      .bg video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.35) contrast(1.15);
        transform: scale(1.05);
      }

      .navbar {
        position: fixed;
        top: 6vh;
        left: 0;
        width: 100%;
        height: 90px;
        padding: 0 70px;
        display: flex;
        align-items: center;
        z-index: 900;
        background: linear-gradient(to bottom, rgba(2, 3, 7, 0.95), rgba(2, 3, 7, 0.55));
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }

      .logo {
        text-decoration: none;
        color: white;
        font-family: "Cinzel", serif;
        font-size: 2rem;
        font-weight: 700;
      }

      .logo span {
        color: var(--prestige-gold);
      }

      .viewport {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: relative;
        z-index: 10;
        padding: 130px 20px 90px;
      }

      .panel-wrap {
        width: 100%;
        max-width: 480px;
      }

      .panel {
        background: var(--glass);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        padding: 40px 32px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .panel:hover {
        border-color: var(--prestige-gold);
      }

      .brand {
        text-align: center;
        font-family: "Cinzel", serif;
        font-size: 2rem;
        font-weight: 700;
        color: white;
        margin-bottom: 8px;
      }

      .brand span {
        color: var(--prestige-gold);
      }

      .tag {
        display: block;
        text-align: center;
        color: var(--prestige-gold);
        font-size: 11px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      .icon {
        text-align: center;
        font-size: 3rem;
        margin-bottom: 15px;
      }

      .title {
        font-family: "Cinzel", serif;
        font-size: 1.8rem;
        font-weight: 700;
        text-align: center;
        color: white;
        margin-bottom: 15px;
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        line-height: 1.7;
        font-size: 0.95rem;
        margin-bottom: 25px;
      }

      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: 0.4s;
        text-decoration: none;
        display: block;
        text-align: center;
      }

      .btn-primary {
        background: var(--prestige-gold);
        color: black;
      }

      .btn-primary:hover {
        background: var(--prestige-light);
        transform: translateY(-3px);
      }

      @media (max-width: 768px) {
        .matte-top,
        .matte-bottom {
          height: 4vh;
        }
        .navbar {
          top: 4vh;
          height: 65px;
          padding: 0 20px;
        }
        .logo {
          font-size: 1.5rem;
        }
        .viewport {
          padding: 110px 15px 60px;
        }
        .panel {
          padding: 30px 20px;
        }
        .title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="film-grain"></div>
    <div class="matte-top"></div>
    <div class="matte-bottom"></div>

    <div class="bg">
      <video autoplay muted loop playsinline>
        <source src="{% static 'videos/intro.mp4' %}" type="video/mp4" />
      </video>
    </div>

    <nav class="navbar">
      <a href="{% url 'landing' %}" class="logo"> Lumina<span>Recs</span> </a>
    </nav>

    <div class="viewport">
      <div class="panel-wrap">
        <div class="panel">
          <div class="brand">Lumina<span>Recs</span></div>

          <span class="tag">Account Recovery</span>

          <div class="icon">✅</div>

          <h1 class="title">Password Reset Complete</h1>

          <p class="subtitle">
            Your password has been successfully changed.
            You can now log in with your new password.
          </p>

          <a href="{% url 'login' %}" class="btn btn-primary">
            Login Now
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
