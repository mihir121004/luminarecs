# ==========================================================================
# LUMINARECS — RENDER BLUEPRINT (free tier demo)
#
#   One-click deploy: Render dashboard → New → Blueprint → pick this repo.
#   Or via button/docs in docs/DEMO_DEPLOYMENT.md.
#
#   - Builds Dockerfile.demo (lightweight, no torch — see requirements-demo.txt)
#   - Free plan: 512 MB RAM, spins down after ~15 min idle (first visit
#     afterwards wakes it in ~30-60 s)
#   - SQLite + locmem cache: no managed databases needed or billed
#   - SECRET_KEY auto-generated by Render; the domain is wired up by
#     entrypoint_demo.sh via RENDER_EXTERNAL_HOSTNAME
# ==========================================================================
services:
  - type: web
    name: luminarecs-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: TRUST_PROXY
        value: "True"
