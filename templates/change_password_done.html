{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LuminaRecs — Password Changed</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{% static 'images/favicon.svg' %}"
    />
    <style>
      :root {
        --black: #020307;
        --gold: #c39b34;
        --gold-light: #e6c15c;
        --muted: #8d95a3;
        --glass: rgba(6, 9, 20, 0.82);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--black);
        color: #d1d5db;
        font-family: "Inter", sans-serif;
        min-height: 100svh;
      }
      .film-grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      .bg {
        position: fixed;
        inset: 0;
        z-index: 1;
        overflow: hidden;
      }
      .bg video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.3);
      }
      .navbar {
        position: fixed;
        top: 6vh;
        left: 0;
        width: 100%;
        height: 80px;
        padding: 0 70px;
        display: flex;
        align-items: center;
        z-index: 900;
        background: linear-gradient(
          to bottom,
          rgba(2, 3, 7, 0.95),
          rgba(2, 3, 7, 0.55)
        );
        backdrop-filter: blur(20px);
      }
      .logo {
        text-decoration: none;
        color: white;
        font-family: "Cinzel", serif;
        font-size: 2rem;
        font-weight: 700;
      }
      .logo span {
        color: var(--gold);
      }
      .viewport {
        position: relative;
        z-index: 10;
        min-height: 100svh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 140px 20px 80px;
      }
      .panel {
        background: var(--glass);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        padding: 50px 40px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 18px;
      }
      .title {
        font-family: "Cinzel", serif;
        font-size: 1.8rem;
        color: white;
        margin-bottom: 15px;
      }
      .subtitle {
        color: var(--muted);
        line-height: 1.8;
        font-size: 0.95rem;
        margin-bottom: 28px;
      }
      .btn {
        display: block;
        padding: 15px;
        border-radius: 14px;
        background: var(--gold);
        color: black;
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: 0.35s;
      }
      .btn:hover {
        background: var(--gold-light);
        transform: translateY(-3px);
      }
      @media (max-width: 768px) {
        .navbar {
          padding: 0 20px;
          height: 65px;
          top: 4vh;
        }
        .logo {
          font-size: 1.5rem;
        }
        .viewport {
          padding-top: 110px;
        }
        .panel {
          padding: 35px 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="film-grain"></div>
    <div class="bg">
      <video poster="{% static 'images/intro-poster.jpg' %}" autoplay muted loop playsinline>
        <source src="{% static 'videos/intro-portrait.mp4' %}" media="(max-width: 768px)" type="video/mp4" />
        <source src="{% static 'videos/intro.mp4' %}" type="video/mp4" />
      </video>
    </div>
    <nav class="navbar">
      <a href="{% url 'homepage' %}" class="logo">Lumina<span>Recs</span></a>
    </nav>
    <div class="viewport">
      <div class="panel">
        <div class="icon">✅</div>
        <h1 class="title">Password Updated</h1>
        <p class="subtitle">
          Your password has been changed successfully. Use your new password
          next time you log in.
        </p>
        <a href="{% url 'profile' %}" class="btn">Back to Profile</a>
      </div>
    </div>
      <script>
      /* Respect reduced-motion: freeze backgrounds on their poster frame. */
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.querySelectorAll("video").forEach((v) => v.removeAttribute("autoplay"));
      }
    </script>
</body>
</html>
